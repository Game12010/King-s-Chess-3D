<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>Dino Rush 3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }


        /* =====================================================
           DEVICE VIEWPORT
           ===================================================== */

        #viewport {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
            background: #000;
        }


        /* =====================================================
           INTERNAL 1920 × 1080 CANVAS

           THIS NEVER CHANGES.

           THE GAME ALWAYS HAS:

           1920 × 1080
           ===================================================== */

        #portrait {
            position: absolute;

            width: 1920px;
            height: 1080px;

            left: 50%;
            top: 50%;

            margin-left: -960px;
            margin-top: -540px;

            overflow: hidden;

            background: #000;

            transform-origin: center center;

            visibility: hidden;
        }


        /* =====================================================
           GAME

           INTERNAL SIZE: 1920 × 1080
           ===================================================== */

        #game {
            position: absolute;

            left: 0;
            top: 0;

            width: 1920px;
            height: 1080px;

            overflow: hidden;

            background: #000;
        }


        /* =====================================================
           IFRAME

           THE IFRAME ITSELF REMAINS 1920 × 1080.
           ===================================================== */

        #game iframe {
            position: absolute;

            left: 0;
            top: 0;

            width: 1920px;
            height: 1080px;

            border: none;

            display: block;

            background: #000;
        }


        /* =====================================================
           SPLASH SCREEN
           ===================================================== */

        #splash {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 999999;

            opacity: 0;

            pointer-events: all;

            animation:
                splashFadeIn 0.75s ease-in forwards,
                splashStay 1.5s linear 0.75s forwards,
                splashFadeOut 0.75s ease-out 2.25s forwards;
        }


        #splash img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        @keyframes splashFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        @keyframes splashStay {
            from {
                opacity: 1;
            }

            to {
                opacity: 1;
            }
        }


        @keyframes splashFadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

    </style>
</head>

<body>


<!-- =====================================================
     SPLASH SCREEN
     ===================================================== -->

<div id="splash">

    <img
        src="./assets/Start.jpeg"
        alt="Dino Rush"
    >

</div>


<div id="viewport">

    <div id="portrait">

        <div id="game">

            <iframe
                id="gameFrame"
                src="./menu.html"
                tabindex="0"
                allow="fullscreen; autoplay; gamepad; pointer-lock"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</div>


<!-- =====================================================
     BACKGROUND MUSIC
     ===================================================== -->

<audio id="backgroundMusic" loop>

    <source
        src="./music.mp3"
        type="audio/mpeg">

</audio>


<script>

    /* =====================================================
       XBOX / VIRTUAL XBOX CONTROLLER
       → IFRAME KEYBOARD INPUT
       ===================================================== */

    let controllerKeys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
        Enter: false
    };


    function sendIframeKey(key, type) {

        try {

            const win = iframe.contentWindow;
            const doc = iframe.contentDocument;

            const keyCodes = {
                ArrowUp: 38,
                ArrowDown: 40,
                ArrowLeft: 37,
                ArrowRight: 39,
                Enter: 13
            };

            const eventData = {
                key: key,
                code: key,
                keyCode: keyCodes[key],
                which: keyCodes[key],
                bubbles: true,
                cancelable: true,
                composed: true
            };


            /* Send to iframe document */

            if (doc) {

                doc.dispatchEvent(
                    new KeyboardEvent(
                        type,
                        eventData
                    )
                );

            }


            /* Send to iframe window */

            if (win) {

                win.dispatchEvent(
                    new KeyboardEvent(
                        type,
                        eventData
                    )
                );

            }


            /* Send to currently focused element */

            if (doc && doc.activeElement) {

                doc.activeElement.dispatchEvent(
                    new KeyboardEvent(
                        type,
                        eventData
                    )
                );

            }

        } catch (error) {

            console.log(
                "Controller iframe error:",
                error
            );

        }

    }


    function setControllerKey(key, pressed) {

        if (pressed && !controllerKeys[key]) {

            controllerKeys[key] = true;

            sendIframeKey(
                key,
                "keydown"
            );

        }

        else if (!pressed && controllerKeys[key]) {

            controllerKeys[key] = false;

            sendIframeKey(
                key,
                "keyup"
            );

        }

    }


    function readXboxController() {

        if (!navigator.getGamepads) {

            requestAnimationFrame(
                readXboxController
            );

            return;

        }


        const gamepads =
            navigator.getGamepads();


        let gamepad = null;


        /* Find the first connected controller */

        for (let i = 0; i < gamepads.length; i++) {

            if (gamepads[i]) {

                gamepad = gamepads[i];

                break;

            }

        }


        if (gamepad) {

            /*
                =================================================
                LEFT STICK
                =================================================

                Standard Gamepad mapping:

                axes[0]
                    -1 = left
                     1 = right

                axes[1]
                    -1 = up
                     1 = down
            */


            const x =
                gamepad.axes.length > 0
                    ? gamepad.axes[0]
                    : 0;


            const y =
                gamepad.axes.length > 1
                    ? gamepad.axes[1]
                    : 0;


            const DEADZONE = 0.35;


            const stickLeft =
                x < -DEADZONE;


            const stickRight =
                x > DEADZONE;


            const stickUp =
                y < -DEADZONE;


            const stickDown =
                y > DEADZONE;


            /*
                =================================================
                XBOX D-PAD
                =================================================

                Standard Xbox mapping:

                12 = Up
                13 = Down
                14 = Left
                15 = Right
            */


            const dpadUp =
                gamepad.buttons[12] &&
                gamepad.buttons[12].pressed;


            const dpadDown =
                gamepad.buttons[13] &&
                gamepad.buttons[13].pressed;


            const dpadLeft =
                gamepad.buttons[14] &&
                gamepad.buttons[14].pressed;


            const dpadRight =
                gamepad.buttons[15] &&
                gamepad.buttons[15].pressed;


            /*
                =================================================
                A BUTTON
                =================================================

                Standard Xbox:

                0 = A
            */


            const a =
                gamepad.buttons[0] &&
                gamepad.buttons[0].pressed;


            /*
                Combine stick + D-pad.
            */

            const up =
                stickUp ||
                dpadUp;


            const down =
                stickDown ||
                dpadDown;


            const left =
                stickLeft ||
                dpadLeft;


            const right =
                stickRight ||
                dpadRight;


            /*
                Send controls.
            */

            setControllerKey(
                "ArrowUp",
                up
            );


            setControllerKey(
                "ArrowDown",
                down
            );


            setControllerKey(
                "ArrowLeft",
                left
            );


            setControllerKey(
                "ArrowRight",
                right
            );


            setControllerKey(
                "Enter",
                a
            );

        }


        requestAnimationFrame(
            readXboxController
        );

    }


    /* =====================================================
       CONTROLLER CONNECTED
       ===================================================== */

    window.addEventListener(
        "gamepadconnected",
        function(event) {

            console.log(
                "Gamepad connected:",
                event.gamepad.id
            );

        }
    );


    /* =====================================================
       CONTROLLER DISCONNECTED
       ===================================================== */

    window.addEventListener(
        "gamepaddisconnected",
        function(event) {

            console.log(
                "Gamepad disconnected:",
                event.gamepad.id
            );


            /*
                Release all keys if controller
                is disconnected.
            */

            setControllerKey(
                "ArrowUp",
                false
            );

            setControllerKey(
                "ArrowDown",
                false
            );

            setControllerKey(
                "ArrowLeft",
                false
            );

            setControllerKey(
                "ArrowRight",
                false
            );

            setControllerKey(
                "Enter",
                false
            );

        }
    );


    /* =====================================================
       START CONTROLLER POLLING
       ===================================================== */

    readXboxController();

    const portrait =
        document.getElementById("portrait");

    const iframe =
        document.getElementById("gameFrame");

    const backgroundMusic =
        document.getElementById("backgroundMusic");

    const splash =
        document.getElementById("splash");


    /* =====================================================
       INTERNAL RESOLUTION

       THE GAME ALWAYS USES THIS SIZE
       ===================================================== */

    const INTERNAL_WIDTH = 1920;
    const INTERNAL_HEIGHT = 1080;


    /* =====================================================
       MUSIC
       ===================================================== */

    backgroundMusic.loop = true;


    function startMusic() {

        backgroundMusic
            .play()
            .catch(() => {
                // Autoplay may be blocked.
            });

    }


    window.addEventListener(
        "load",
        startMusic
    );


    document.addEventListener(
        "click",
        startMusic,
        { once: true }
    );


    document.addEventListener(
        "keydown",
        startMusic,
        { once: true }
    );


    document.addEventListener(
        "touchstart",
        startMusic,
        { once: true }
    );


    /* =====================================================
       RESIZE / STRETCH

       IMPORTANT:

       The internal canvas stays:

       1920 × 1080

       But it is stretched independently:

       X → screen width
       Y → screen height

       NO Math.min()
       NO aspect-ratio preservation
       ===================================================== */

    function resizeGame() {

        const screenWidth =
            window.innerWidth;

        const screenHeight =
            window.innerHeight;


        /* Calculate horizontal stretch */

        const scaleX =
            screenWidth / INTERNAL_WIDTH;


        /* Calculate vertical stretch */

        const scaleY =
            screenHeight / INTERNAL_HEIGHT;


        /*
            DO NOT use translate() here.

            The existing:

            left: 50%;
            top: 50%;
            margin-left: -960px;
            margin-top: -540px;

            already centers the 1920 × 1080 canvas.
        */

        portrait.style.transform =
            `scale(${scaleX}, ${scaleY})`;

    }


    /* =====================================================
       SHOW GAME
       ===================================================== */

    function showGame() {

        resizeGame();

        requestAnimationFrame(() => {

            resizeGame();

            requestAnimationFrame(() => {

                resizeGame();

                portrait.style.visibility =
                    "visible";

            });

        });

    }


    /* =====================================================
       INITIAL
       ===================================================== */

    resizeGame();


    /* =====================================================
       PAGE LOAD
       ===================================================== */

    window.addEventListener(
        "load",
        () => {

            /*
                Keep the game hidden while
                the 3-second splash screen plays.
            */

            portrait.style.visibility =
                "hidden";


            /*
                Splash timing:

                0.00 - 0.75 sec = Fade in
                0.75 - 2.25 sec = Stay
                2.25 - 3.00 sec = Fade out
            */

            setTimeout(() => {

                splash.style.display =
                    "none";

                showGame();

                setTimeout(
                    resizeGame,
                    50
                );

                setTimeout(
                    resizeGame,
                    150
                );

                setTimeout(
                    resizeGame,
                    300
                );

            }, 3000);

        }
    );


    /* =====================================================
       WINDOW RESIZE
       ===================================================== */

    window.addEventListener(
        "resize",
        resizeGame
    );


    /* =====================================================
       ORIENTATION CHANGE
       ===================================================== */

    window.addEventListener(
        "orientationchange",
        () => {

            setTimeout(
                resizeGame,
                50
            );

            setTimeout(
                resizeGame,
                150
            );

            setTimeout(
                resizeGame,
                300
            );

        }
    );


    /* =====================================================
       IFRAME LOAD
       ===================================================== */

    iframe.addEventListener(
        "load",
        () => {

            /*
                Do NOT reveal the game here.
    
                The splash screen must finish
                its full 3-second sequence first.
            */

            resizeGame();

            requestAnimationFrame(() => {
                resizeGame();

                /* Automatically focus menu.html */
                try {
                    iframe.contentWindow.focus();
                    iframe.contentDocument.body.focus();
                } catch (e) {
                    // Ignore focus errors.
                }
            });

            setTimeout(
                resizeGame,
                50
            );

            setTimeout(
                resizeGame,
                150
            );

        }
    );


    /* =====================================================
       FINAL RESIZE
       ===================================================== */

    resizeGame();

</script>

</body>
</html>
