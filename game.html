            requestAnimationFrame(() => {

                loadingScreen.style.opacity = '1';
                loadingScreen.style.visibility = 'visible';
                loadingScreen.style.pointerEvents = 'all';

            });

            // Disable everything behind the loading screen
            document.body.style.pointerEvents = 'none';

            // Keep loading screen active
            loadingScreen.style.pointerEvents = 'all';

            // Navigate to menu
            window.location.href = 'menu.html';
        }

        function scheduleTwoPlayerCameraSwitch() {
            if (pauseSwitchTimer) {
                clearTimeout(pauseSwitchTimer);
                pauseSwitchTimer = null;
            }

            const waitForSwitch = () => {
                // Keep waiting while paused.
                if (isPaused) {
                    pauseSwitchTimer = setTimeout(waitForSwitch, 100);
                    return;
                }

                if (
                    !isFreeCamera &&
                    !chess.game_over()
                ) {
                    activeKingSquare = findActiveKingSquare();

                    if (
                        activeKingSquare &&
                        pieceMeshes[activeKingSquare]
                    ) {
                        const kPos =
                            pieceMeshes[activeKingSquare].position;
        
                        camera.position.set(kPos.x, kPos.y + (2.2 * (sizePercentage / 100)), kPos.z);

                        cameraYaw =
                            activeKingSquare === findWhiteKingSquare()
                                ? 0
                                : Math.PI;

                        cameraPitch = -0.3;

                        camera.rotation.set(
                            cameraPitch,
                            cameraYaw,
                            0
                        );

                        updateKingVisibility();
                    }
                }

                pauseSwitchTimer = null;
            };

            pauseSwitchTimer = setTimeout(waitForSwitch, 500);
        }

        // Pause button
        document.getElementById('pause-button')
            .addEventListener('click', openPauseMenu);

        // Resume
        document.getElementById('resume-btn')
            .addEventListener('click', closePauseMenu);

        // Restart
        document.getElementById('restart-btn')
            .addEventListener('click', restartGame);

        // Main Menu
        document.getElementById('pause-main-menu-btn')
            .addEventListener('click', () => {

                leaveToMainMenu();

            });

        document.getElementById('game-over-main-menu-btn')
            .addEventListener('click', () => {

                leaveToMainMenu();

            });
        
        // Escape also opens/closes pause menu
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {

                // Promotion must be completed before anything else
                if (pendingPromotionMove) {
                    e.preventDefault();
                    return;
                }

                if (isPaused) {
                    closePauseMenu();
                } else {
                    openPauseMenu();
                }
            }
        });

        // ==========================================
        // 8. STOCKFISH AI & GAME OVER
        // ==========================================
        if (config.difficulty !== "2_Player") {
            try {
                // Get the correct absolute URL for the local Stockfish file.
                // This works with your offline/local folder structure.
                const stockfishURL =
                    new URL('libs/stockfish.js', window.location.href).href;

                // Create a worker wrapper that imports the local Stockfish file.
                const sfCode =
                    `importScripts(${JSON.stringify(stockfishURL)});`;

                const blob = new Blob(
                    [sfCode],
                    { type: 'application/javascript' }
                );
        
                sf = new Worker(
                    URL.createObjectURL(blob)
                );

                // Initialize Stockfish
                sf.postMessage('uci');
                sf.postMessage('ucinewgame');

                // Set difficulty
                let skillLevel =
                    config.difficulty === "Medium"
                        ? 10
                        : (config.difficulty === "Hard" ? 20 : 0);

                sf.postMessage(
                    `setoption name Skill Level value ${skillLevel}`
                );        

                // Receive Stockfish messages
                sf.onmessage = function(event) {
                    const line = event.data;

                    if (
                        typeof line === 'string' &&
                        line.startsWith('bestmove')
                    ) {
                        const moveStr = line.split(' ')[1];

                        if (
                            moveStr &&
                            moveStr !== '(none)'
                        ) {
                            const fromSq = moveStr.substring(0, 2);
                            const toSq = moveStr.substring(2, 4);

                            const promo =
                                moveStr.length > 4
                                    ? moveStr[4]
                                    : undefined;
        
                            isAiThinking = false;
        
                            // Find the matching legal chess.js move
                            const legalMove =
                                chess.moves({
                                    verbose: true
                                }).find(
                                    m =>
                                        m.from === fromSq &&
                                        m.to === toSq
                                );
        
                            if (legalMove) {
                                executeMove({
                                    from: fromSq,
                                    to: toSq,
                                    promotion: promo,
                                    flags: legalMove.flags
                                });
                            }
                        } else {
                            // No legal move returned
                            isAiThinking = false;
                        }
                    }
                };

                // Handle worker errors instead of silently ignoring them.
                sf.onerror = function(error) {
                    console.error(
                        "Stockfish worker error:",
                        error
                    );

                    isAiThinking = false;
                };

            } catch (err) {
                console.error(
                    "Failed to initialize Stockfish:",
                    err
                );

                isAiThinking = false;
            }
        }

        function triggerAIMove() {
            if (!sf) return;

            isAiThinking = true;

            // ==========================================
            // EASY AI = BEGINNER LEVEL
            // ==========================================
            if (config.difficulty === "Easy") {

                setTimeout(() => {
                    const legalMoves = chess.moves({
                        verbose: true
                    });

                    if (!legalMoves.length) {
                        isAiThinking = false;
                        return;
                    }
        
                    /*
                     * Easy AI deliberately makes mistakes.
                     *
                     * 65% chance:
                     * Use Stockfish depth 1.
                     *
                     * 35% chance:
                     * Choose a random legal move.
                     *
                     * This makes Easy feel much more like a
                     * beginner instead of a weak Stockfish player.
                     */

                    if (Math.random() < 0.35) {
                        const randomMove =
                            legalMoves[
                                Math.floor(
                                    Math.random() * legalMoves.length
                                )
                            ];

                        isAiThinking = false;

                        executeMove({
                            from: randomMove.from,
                            to: randomMove.to,
                            promotion: randomMove.promotion,
                            flags: randomMove.flags
                        });

                        return;
                    }

                    // Normal Easy Stockfish move
                    sf.postMessage(
                        `position fen ${chess.fen()}`
                    );

                    sf.postMessage(
                        `go depth 1`
                    );

                }, 300);

                return;
            }

            // ==========================================
            // MEDIUM / HARD — UNCHANGED
            // ==========================================

            let depth =
                config.difficulty === "Hard"
                    ? 10
                    : 5;

            setTimeout(() => {
                sf.postMessage(
                    `position fen ${chess.fen()}`
                );

                sf.postMessage(
                    `go depth ${depth}`
                );
            }, 100);
        }

        function checkGameOver() {
            if (chess.game_over()) {
                gameOverSound.currentTime = 0;
                gameOverSound.play().catch(() => {});
                setTimeout(() => {
                    const txt =
                        document.getElementById('game-result');
                        document.getElementById('pause-button').style.display = 'none';

                    if (chess.in_checkmate()) {
                        txt.innerText =
                            `${chess.turn() === 'w' ? 'Black' : 'White'} Won!`;
                    } else if (chess.in_stalemate()) {
                        txt.innerText = "Stalemate!";
                    } else {
                        txt.innerText = "Draw!";
                    }

                    document.getElementById(
                        'game-over-screen'
                    ).style.display = 'flex';

                    document.exitPointerLock();
                }, 600);
            }
        }

        document.getElementById('play-again-btn').addEventListener('click', () => {
            chess.reset();
            initPieces();

            document.getElementById(
                'game-over-screen'
            ).style.display = 'none';

            isAiThinking = false;
            isAnimating = false;

            if (sf) {
                sf.postMessage('ucinewgame');
            }

            if (
                config.difficulty !== "2_Player" &&
                config.player === "Black"
            ) {
                triggerAIMove();
            }
        });

        // ==========================================
        // PAUSE MENU ARROW KEY NAVIGATION
        // ==========================================
        document.addEventListener('keydown', (event) => {
            // Only intercept keys if the game is paused
            if (!isPaused) return;

            const navigationKeys = ['ArrowUp', 'ArrowDown', 'Enter'];
            if (!navigationKeys.includes(event.key)) return;

            event.preventDefault(); // Prevent scrolling

            const pauseMenu = document.getElementById('pause-menu');
            // Get all the stylized buttons in the pause menu
            const buttons = Array.from(pauseMenu.querySelectorAll('.btn'));
    
            if (buttons.length === 0) return;

            let currentIndex = buttons.indexOf(document.activeElement);

            // If nothing is focused, start at the first button
            if (currentIndex === -1) {
                currentIndex = 0;
                buttons[currentIndex].focus();
                return;
            }
        
            // ENTER = select the highlighted button
            if (event.key === 'Enter') {
                buttons[currentIndex].click();
                return;
            }

            // UP = move selection upward
            if (event.key === 'ArrowUp') {
                currentIndex--;
                if (currentIndex < 0) {
                    currentIndex = buttons.length - 1; // Wrap to bottom
                }
                buttons[currentIndex].focus();
                return;
            }

            // DOWN = move selection downward
            if (event.key === 'ArrowDown') {
                currentIndex++;
                if (currentIndex >= buttons.length) {
                    currentIndex = 0; // Wrap to top
                }
                buttons[currentIndex].focus();
                return;
            }
        });

        document.addEventListener('keydown', (event) => {

            if (!pendingPromotionMove) return;

            const promotionMenu =
                document.getElementById('promotion-menu');

            const buttons = Array.from(
                promotionMenu.querySelectorAll('.promotion-option')
            );

            if (!buttons.length) return;

            const navigationKeys = [
                'ArrowLeft',
                'ArrowRight',
                'ArrowUp',
                'ArrowDown',
                'Enter'
            ];

            if (!navigationKeys.includes(event.key)) return;

            event.preventDefault();

            let currentIndex =
                buttons.indexOf(document.activeElement);

            if (currentIndex === -1) {
                currentIndex = 0;
                buttons[currentIndex].focus();
                return;
            }

            if (event.key === 'Enter') {
                buttons[currentIndex].click();
                return;
            }

            if (
                event.key === 'ArrowRight' ||
                event.key === 'ArrowDown'
            ) {
                currentIndex++;

                if (currentIndex >= buttons.length) {
                    currentIndex = 0;
                }
            }

            if (
                event.key === 'ArrowLeft' ||
                event.key === 'ArrowUp'
            ) {
                currentIndex--;

                if (currentIndex < 0) {
                    currentIndex = buttons.length - 1;
                }
            }

            buttons[currentIndex].focus();
        });

        window.addEventListener('resize', () => {
            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });

        // Launch
        loadAssets();
    </script>
</body>
</html>
